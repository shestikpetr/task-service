apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-service
  namespace: staging
  labels:
    app: task-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-service
  template:
    metadata:
      labels:
        app: task-service
    spec:
      containers:
        - name: task-service
          # Updated by CI (update-manifest job) after the image is promoted to staging
          image: ghcr.io/shestikpetr/task-service-staging:initial
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/tasks
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: task-service-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: task-service-db
                  key: password
            - name: REDIS_HOST
              value: redis
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
