plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.3.21'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.3.21'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.jlleitschuh.gradle.ktlint' version '13.1.0'
    id 'jacoco'
}

group = 'com.shestikpetr'
version = '0.0.1-SNAPSHOT'
description = 'task-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// Integration tests live in src/integrationTest and run only via the integrationTest task,
// so the unit test task never needs Docker, PostgreSQL or Redis
sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

// Versions of all resolved dependencies are pinned in gradle.lockfile.
// Regenerate after changing dependencies: ./gradlew dependencies --write-locks
dependencyLocking {
    lockAllConfigurations()
    lockMode = LockMode.STRICT
}

// Downloads every dependency artifact without compiling sources.
// The Dockerfile runs it in a separate layer so dependencies are cached independently of the code.
tasks.register('downloadDependencies') {
    doLast {
        configurations.findAll { it.canBeResolved }.each { it.resolve() }
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'tools.jackson.module:jackson-module-kotlin'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    runtimeOnly 'org.postgresql:postgresql'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    integrationTestImplementation 'org.springframework.boot:spring-boot-testcontainers'
    integrationTestImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    integrationTestImplementation 'org.testcontainers:testcontainers-postgresql'
}

kotlin {
    compilerOptions {
        freeCompilerArgs.addAll '-Xjsr305=strict', '-Xannotation-default-target=param-property'
    }
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy 'jacocoTestReport'
}

// Test classes run concurrently (JUnit 5 parallel execution); each test starts its own containers.
// Run sequentially for comparison: ./gradlew integrationTest -PparallelTests=false
tasks.register('integrationTest', Test) {
    description = 'Runs integration tests against PostgreSQL and Redis in Testcontainers.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter 'test'
    systemProperty 'junit.jupiter.execution.parallel.enabled', findProperty('parallelTests') ?: 'true'
    systemProperty 'junit.jupiter.execution.parallel.mode.classes.default', 'concurrent'
    systemProperty 'junit.jupiter.execution.parallel.mode.default', 'same_thread'
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

// Code that talks to PostgreSQL/Redis is verified by integration tests,
// so it is excluded from the unit test coverage report and gate
def unitCoverageExcludes = ['**/visits/**']

jacocoTestReport {
    classDirectories.setFrom(files(classDirectories.files.collect { fileTree(it) { exclude unitCoverageExcludes } }))
    reports {
        xml.required = true
        csv.required = true
        html.required = true
    }
}

// Quality Gate: the build fails if line or branch coverage drops below 80%
jacocoTestCoverageVerification {
    classDirectories.setFrom(files(classDirectories.files.collect { fileTree(it) { exclude unitCoverageExcludes } }))
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.80
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.80
            }
        }
    }
}

tasks.named('check') {
    dependsOn 'jacocoTestCoverageVerification'
}
