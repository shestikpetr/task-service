name: CI

on:
  push:
    branches: [main]
  pull_request:
    # main + lab branches: each lab PR targets the previous lab's branch
    branches: [main, 'lab*']

permissions:
  contents: read

jobs:
  build:
    name: Lint, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # cache: gradle caches ~/.gradle/caches and ~/.gradle/wrapper,
      # the key is a hash of **/*.gradle* and **/gradle-wrapper.properties
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # STRICT dependency locking: resolution fails if anything differs from gradle.lockfile
      - name: Install dependencies
        run: ./gradlew dependencies --quiet > /dev/null

      - name: Lint
        run: ./gradlew ktlintCheck

      # jacocoTestCoverageVerification is the Quality Gate: fails if coverage < 80%
      - name: Test with coverage
        run: ./gradlew test jacocoTestCoverageVerification

      - name: Coverage summary
        if: always()
        run: |
          csv=build/reports/jacoco/test/jacocoTestReport.csv
          if [ ! -f "$csv" ]; then
            echo "Coverage report not found" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          awk -F, 'NR > 1 { bm += $6; bc += $7; lm += $8; lc += $9 }
            END {
              printf "## Coverage\n\n| Metric | Coverage |\n|---|---|\n"
              printf "| Lines | %.1f%% |\n", 100 * lc / (lc + lm)
              printf "| Branches | %.1f%% |\n", (bc + bm) ? 100 * bc / (bc + bm) : 100
            }' "$csv" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/jacoco/test/
          if-no-files-found: ignore

      - name: Build
        run: ./gradlew bootJar

  docker:
    name: Docker image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # lets GITHUB_TOKEN push to ghcr.io
    env:
      IMAGE: ghcr.io/${{ github.repository }}   # registry requires lowercase; owner/repo already are
      TRIVY: aquasec/trivy:0.65.0               # pinned scanner version

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # push: false + load: true — the image goes to the runner's Docker Engine only;
      # it is published later, after the vulnerability scan passes.
      # type=gha keeps the layer cache in GitHub Actions cache between runs.
      - name: Build image with layer cache
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHORT_SHA }}
            ${{ env.IMAGE }}:build-${{ github.run_number }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy full report
        run: >
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache -v "$PWD:/work"
          "$TRIVY" image --format table --output /work/trivy-report.txt "$IMAGE:$SHORT_SHA"

      - name: Generate SBOM (CycloneDX)
        run: >
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache -v "$PWD:/work"
          "$TRIVY" image --format cyclonedx --output /work/sbom.cdx.json "$IMAGE:$SHORT_SHA"

      # Quality Gate: fail on HIGH/CRITICAL vulnerabilities that already have a fix
      - name: Trivy quality gate
        run: >
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache
          "$TRIVY" image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE:$SHORT_SHA"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
          if-no-files-found: ignore

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: ignore

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reuses the scanned local image: both tags are pushed, no rebuild
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push --all-tags "$IMAGE"
