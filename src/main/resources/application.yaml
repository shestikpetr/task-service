spring:
  application:
    name: task-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tasks}
    username: ${DB_USERNAME:tasks}
    password: ${DB_PASSWORD:tasks}
  sql:
    init:
      mode: always  # applies schema.sql (CREATE TABLE IF NOT EXISTS) on startup
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus  # Prometheus scrapes /actuator/prometheus

app:
  version: ${APP_VERSION:dev}
  chaos:
    enabled: ${CHAOS_MODE:false}  # broken build: /health fails part of the requests
    failure-rate: 0.3
