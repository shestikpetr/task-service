# Argo Rollouts notifications: when a Rollout becomes Degraded (automatic rollback),
# the controller POSTs a Slack-style JSON message to a webhook.
# Instead of Slack, the webhook points to a local receiver in the cluster (webhook-receiver below),
# which prints every message to its log.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argo-rollouts-notification-configmap
  namespace: argo-rollouts
data:
  service.webhook.rollout-receiver: |
    url: http://webhook-receiver.staging.svc.cluster.local:8080/
    headers:
      - name: Content-Type
        value: application/json
  template.rollout-degraded: |
    webhook:
      rollout-receiver:
        method: POST
        body: |
          {"text": ":rotating_light: Rollout {{.rollout.metadata.name}} ({{.rollout.metadata.namespace}}) rolled back automatically: 5xx error rate exceeded the threshold. Image: {{(index .rollout.spec.template.spec.containers 0).image}}"}
  trigger.on-rollout-degraded: |
    - when: rollout.status.phase == 'Degraded'
      send: [rollout-degraded]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: webhook-receiver
  namespace: staging
data:
  receiver.py: |
    from datetime import datetime, timezone
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            body = self.rfile.read(int(self.headers.get("Content-Length", 0))).decode()
            print(f"{datetime.now(timezone.utc).isoformat()} notification received: {body}", flush=True)
            self.send_response(200)
            self.end_headers()
            self.wfile.write(b"ok")

        def log_message(self, *args):
            pass

    HTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-receiver
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook-receiver
  template:
    metadata:
      labels:
        app: webhook-receiver
    spec:
      containers:
        - name: receiver
          image: python:3.13-alpine
          command: ["python", "-u", "/app/receiver.py"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: script
              mountPath: /app
      volumes:
        - name: script
          configMap:
            name: webhook-receiver
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-receiver
  namespace: staging
spec:
  selector:
    app: webhook-receiver
  ports:
    - port: 8080
