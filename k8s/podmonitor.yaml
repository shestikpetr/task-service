apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: task-service
  namespace: staging
  labels:
    release: monitoring  # kube-prometheus-stack only picks up monitors labelled with its release name
spec:
  namespaceSelector:
    matchNames:
      - staging
  selector:
    matchLabels:
      app: task-service  # same label as the pod template of the Deployment and the Rollout
  podMetricsEndpoints:
    - targetPort: 8080
      path: /actuator/prometheus
      interval: 15s
